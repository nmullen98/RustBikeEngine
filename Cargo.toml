[package]
name = "motorbike-engine-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A real-time, physically grounded motorbike engine simulator"
publish = false

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
