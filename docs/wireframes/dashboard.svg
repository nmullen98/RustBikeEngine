<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #dbe4ec; }
    .muted { fill: #82909c; font-size: 13px; }
    .label { fill: #82909c; font-size: 12px; letter-spacing: 1.2px; }
    .value { font-size: 24px; font-weight: 650; }
    .line { stroke: #44515d; stroke-width: 2; fill: none; }
  </style>
  <rect width="1200" height="760" rx="12" fill="#12171d"/>
  <rect x="1" y="1" width="1198" height="758" rx="11" fill="none" stroke="#35404a"/>
  <path d="M0 66H1200M280 66V760" stroke="#35404a"/>
  <text x="26" y="42" font-size="20" font-weight="700">MOTORBIKE ENGINE LAB</text>
  <text x="915" y="40" class="muted">650 cc inline four</text>

  <text x="24" y="105" class="label">CONTROLS</text>
  <rect x="24" y="126" width="18" height="18" rx="3" fill="#39be9a"/>
  <path d="M28 135l4 4 7-9" stroke="#0d1517" stroke-width="2.5" fill="none"/>
  <text x="54" y="141">Ignition</text>
  <rect x="24" y="165" width="232" height="42" rx="6" fill="#25313a"/>
  <text x="140" y="191" text-anchor="middle" font-weight="600">Hold starter</text>
  <text x="24" y="247">Throttle</text><text x="256" y="247" text-anchor="end">18%</text>
  <path d="M24 270H256" class="line"/><path d="M24 270H82" stroke="#39be9a" stroke-width="4"/>
  <circle cx="82" cy="270" r="8" fill="#39be9a"/>
  <text x="24" y="316">Dynamometer load</text><text x="256" y="316" text-anchor="end">8 Nm</text>
  <path d="M24 339H256" class="line"/><path d="M24 339H58" stroke="#39be9a" stroke-width="4"/>
  <circle cx="58" cy="339" r="8" fill="#39be9a"/>
  <path d="M24 385H256" stroke="#35404a"/>
  <text x="24" y="420" class="label">SIMULATION</text>
  <rect x="24" y="439" width="18" height="18" rx="3" fill="none" stroke="#60707e"/>
  <text x="54" y="454">Pause physics</text>
  <text x="24" y="492" class="muted">Physics: fixed 1 kHz step</text>
  <text x="24" y="518" class="muted">Audio: live procedural output</text>

  <g transform="translate(306 94)">
    <g><rect width="196" height="76" rx="7" fill="#192129"/><text x="14" y="23" class="label">ENGINE SPEED</text><text x="14" y="56" class="value">1,250 rpm</text></g>
    <g transform="translate(212 0)"><rect width="196" height="76" rx="7" fill="#192129"/><text x="14" y="23" class="label">NET TORQUE</text><text x="14" y="56" class="value">+4.2 Nm</text></g>
    <g transform="translate(424 0)"><rect width="196" height="76" rx="7" fill="#192129"/><text x="14" y="23" class="label">COMBUSTION</text><text x="14" y="56" class="value">9.7 Nm</text></g>
    <g transform="translate(636 0)"><rect width="230" height="76" rx="7" fill="#192129"/><text x="14" y="23" class="label">STATE</text><text x="14" y="56" class="value">Running</text></g>
  </g>
  <rect x="306" y="188" width="866" height="18" rx="9" fill="#27323c"/><rect x="306" y="188" width="110" height="18" rx="9" fill="#39be9a"/>
  <text x="1164" y="202" text-anchor="end" class="muted">Redline 10,000 rpm</text>

  <rect x="306" y="226" width="866" height="500" rx="10" fill="#0d1116"/>
  <text x="630" y="276" text-anchor="middle" class="label">CYL 1</text><text x="846" y="276" text-anchor="middle" class="label">CYL 2</text>
  <rect x="584" y="320" width="92" height="54" rx="5" fill="#b0bbc6"/><rect x="800" y="350" width="92" height="54" rx="5" fill="#b0bbc6"/>
  <path d="M630 374L742 550M846 404L742 550" stroke="#788592" stroke-width="9"/>
  <circle cx="742" cy="550" r="66" fill="none" stroke="#5c6874" stroke-width="6"/>
  <circle cx="742" cy="550" r="12" fill="#39be9a"/>
  <text x="328" y="696" class="muted">Effective throttle 18%</text>
</svg>
